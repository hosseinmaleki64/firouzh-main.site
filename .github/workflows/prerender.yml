name: prerender
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/prerender.py
      - name: Commit changes
        run: |
          git config user.name "prerender-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "prerender: update static content"
          git push